<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Mapa mental interativo da ABNT NBR ISO 21101: como implementar o SGS no turismo de aventura.">
<style>:root{color-scheme:light}html,body{height:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Mapa Mental do SGS</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: cabeçalho enxuto + legenda, depois o mapa arrastável (esquerda) e o painel de detalhes (direita; folha inferior no celular).
   A cor do nó segue a profundidade, como no mapa de referência: lavanda, azul, verde-água, verde. */
:root{
  --font-ui:'Albert Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --bg:#f2f4fa; --surface:#ffffff; --canvas:#f7f8fd; --ink:#1b2135; --muted:#59617a; --hair:#d5dbea; --dot:#d8ddec;
  --accent:#3552d6; --accent-soft:#e2e8ff; --on-accent:#ffffff;
  --root-bg:#c8cbfa; --root-ink:#1d2160;
  --l1-bg:#b9d4f5; --l1-ink:#10294c; --e1:#8aa2f0;
  --l2-bg:#a2dbd0; --l2-ink:#0b3a35; --e2:#5ab09f;
  --l3-bg:#a9ebc6; --l3-ink:#0e3b25; --e3:#5ab09f;
  --doc-bg:#ffdc94; --doc-ink:#4a2f00; --doc-solid:#8a5200;
  --reg-bg:#ffc8d2; --reg-ink:#561224; --reg-solid:#a3243f;
  --ex-bg:#e4d4fa; --ex-ink:#2e1a52; --ex-solid:#6a3fb5;
  --tag-ink:#ffffff;
  --ok:#1d8a57; --ok-soft:#d6f1e2;
  --risk-low:#cdeed9; --risk-mid:#ffe7a6; --risk-high:#ffb9ab;
  --shadow:0 6px 24px rgba(27,33,53,.10);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10131c; --surface:#181c28; --canvas:#141824; --ink:#e7eaf5; --muted:#9aa3bd; --hair:#2b3247; --dot:#232a3d;
    --accent:#9bb0ff; --accent-soft:#252d52; --on-accent:#10131c;
    --root-bg:#3b4195; --root-ink:#e8eaff;
    --l1-bg:#244b80; --l1-ink:#dcebff; --e1:#5b78c8;
    --l2-bg:#1e5a52; --l2-ink:#d3f5ee; --e2:#3f8c7d;
    --l3-bg:#1f5a3d; --l3-ink:#d6f7e4; --e3:#3f8c7d;
    --doc-bg:#6a4a05; --doc-ink:#ffeabd; --doc-solid:#ffc95c;
    --reg-bg:#6b2536; --reg-ink:#ffdde4; --reg-solid:#ff9db0;
    --ex-bg:#483376; --ex-ink:#eddfff; --ex-solid:#c4a4ff;
    --tag-ink:#17120a;
    --ok:#52d391; --ok-soft:#1c3b2c;
    --risk-low:#1f4a34; --risk-mid:#5a4a12; --risk-high:#6e2b25;
    --shadow:0 6px 24px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10131c; --surface:#181c28; --canvas:#141824; --ink:#e7eaf5; --muted:#9aa3bd; --hair:#2b3247; --dot:#232a3d;
  --accent:#9bb0ff; --accent-soft:#252d52; --on-accent:#10131c;
  --root-bg:#3b4195; --root-ink:#e8eaff;
  --l1-bg:#244b80; --l1-ink:#dcebff; --e1:#5b78c8;
  --l2-bg:#1e5a52; --l2-ink:#d3f5ee; --e2:#3f8c7d;
  --l3-bg:#1f5a3d; --l3-ink:#d6f7e4; --e3:#3f8c7d;
  --doc-bg:#6a4a05; --doc-ink:#ffeabd; --doc-solid:#ffc95c;
  --reg-bg:#6b2536; --reg-ink:#ffdde4; --reg-solid:#ff9db0;
  --ex-bg:#483376; --ex-ink:#eddfff; --ex-solid:#c4a4ff;
  --tag-ink:#17120a;
  --ok:#52d391; --ok-soft:#1c3b2c;
  --risk-low:#1f4a34; --risk-mid:#5a4a12; --risk-high:#6e2b25;
  --shadow:0 6px 24px rgba(0,0,0,.45);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
html{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font-ui);padding-inline:16px;padding-block:12px;overflow:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
h1,h2,h3,p,ul,ol{margin:0}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#app{height:100%;display:flex;flex-direction:column;gap:10px;min-height:0}

/* cabeçalho */
.top{display:grid;grid-template-columns:auto minmax(220px,420px) auto;align-items:center;justify-content:space-between;gap:12px 20px}
.ttl{min-width:0}
.ttl h1{font-size:19px;line-height:1.2;font-weight:700;letter-spacing:-.01em}
.ttl p{color:var(--muted);font-size:12.5px;margin-top:2px}
.srch{position:relative;min-width:0}
.srch svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.srch input{width:100%;height:38px;border-radius:19px;border:1px solid var(--hair);background:var(--surface);color:var(--ink);padding:0 14px 0 36px;font:inherit}
.srch input::placeholder{color:var(--muted)}
.results{position:absolute;z-index:30;left:0;right:0;top:44px;background:var(--surface);border:1px solid var(--hair);border-radius:12px;box-shadow:var(--shadow);padding:6px;max-height:320px;overflow:auto}
.results button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px;cursor:pointer}
.results button:hover,.results button:focus-visible{background:var(--accent-soft)}
.results b{display:block;font-weight:600}
.results small{color:var(--muted);font-size:12px}
.results .none{padding:10px;color:var(--muted)}
.progress{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--hair);border-radius:19px;height:38px;padding:0 14px;cursor:pointer;white-space:nowrap}
.progress .pl{color:var(--muted);font-size:12.5px}
.progress b{font-family:var(--font-mono);font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
.progress .bar{width:64px;height:6px;border-radius:3px;background:var(--hair);overflow:hidden}
.progress .bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}

/* legenda */
.legend{display:flex;align-items:center;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.legend .lg{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;border:1px solid var(--hair);background:var(--surface);border-radius:16px;padding:4px 12px 4px 6px;cursor:pointer;font-size:12.5px}
.legend .lg[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.legend .note{color:var(--muted);font-size:12.5px;white-space:nowrap;padding-left:6px}
.legend .sw{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-size:12.5px;color:var(--muted)}
.dot{width:12px;height:12px;border-radius:4px;display:inline-block}

/* área de trabalho */
.work{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 392px;gap:12px}
#stage{position:relative;overflow:hidden;border-radius:16px;border:1px solid var(--hair);background-color:var(--canvas);background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:22px 22px;touch-action:none;cursor:grab;min-width:0}
#stage.grabbing{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.edge{fill:none;stroke-width:1.7;stroke-linecap:round}
.edge.e1{stroke:var(--e1)} .edge.e2{stroke:var(--e2)} .edge.e3{stroke:var(--e3)}
.link{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:6 6;stroke-linecap:round}
.linkdot{fill:var(--accent)}

.nw{position:absolute;left:0;top:0;display:flex;align-items:center;gap:6px;--nbg:var(--l3-bg);--nink:var(--l3-ink);--solid:var(--doc-solid);--tgline:var(--e3)}
.nw.d0{--nbg:var(--root-bg);--nink:var(--root-ink);--tgline:var(--e1)}
.nw.d1{--nbg:var(--l1-bg);--nink:var(--l1-ink);--tgline:var(--e2)}
.nw.d2{--nbg:var(--l2-bg);--nink:var(--l2-ink);--tgline:var(--e3)}
.nw.d3{--nbg:var(--l3-bg);--nink:var(--l3-ink)}
.nw.k-doc{--nbg:var(--doc-bg);--nink:var(--doc-ink);--solid:var(--doc-solid)}
.nw.k-reg{--nbg:var(--reg-bg);--nink:var(--reg-ink);--solid:var(--reg-solid)}
.nw.k-ex{--nbg:var(--ex-bg);--nink:var(--ex-ink);--solid:var(--ex-solid)}
.node{display:flex;align-items:center;gap:8px;max-width:272px;text-align:left;border:0;border-radius:10px;padding:9px 14px;background:var(--nbg);color:var(--nink);font-weight:500;font-size:14px;line-height:1.3;cursor:pointer;box-shadow:0 1px 0 rgba(20,30,70,.06)}
.nw.d0 .node{font-weight:600;font-size:15px;padding:12px 16px}
.nw.d1 .node{font-size:15px;padding:10px 15px}
.node:hover{filter:brightness(.97)}
.node.sel{box-shadow:0 0 0 2.5px var(--accent),0 6px 16px rgba(20,30,70,.16)}
.num{font-family:var(--font-mono);font-size:12px;font-weight:500;opacity:.78;flex:none}
.tag{flex:none;font:600 9.5px/1 var(--font-mono);letter-spacing:.07em;padding:4px 5px;border-radius:4px;background:var(--solid);color:var(--tag-ink)}
.tag.rec{background:transparent;color:var(--solid);box-shadow:inset 0 0 0 1.5px var(--solid)}
.ck{display:none;flex:none;width:16px;height:16px;border-radius:50%;background:var(--ok);color:#fff;place-items:center}
.nw.done .ck{display:inline-grid}
.tg{flex:none;width:22px;height:22px;border-radius:50%;border:0;padding:0;display:grid;place-items:center;background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1.6px var(--tgline);cursor:pointer}
.tg svg{transition:transform .2s}
.tg[aria-expanded="true"] svg{transform:rotate(180deg)}
.nw.dim .node,.nw.dim .tg{opacity:.25}

.ctl{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px;z-index:5}
.ctl button{width:38px;height:38px;border-radius:12px;border:1px solid var(--hair);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 8px rgba(27,33,53,.08)}
.ctl button:hover{background:var(--accent-soft)}
.ctl hr{border:0;height:1px;background:var(--hair);margin:2px 4px}
.hint{position:absolute;left:14px;bottom:12px;z-index:5;background:var(--surface);border:1px solid var(--hair);border-radius:10px;padding:6px 10px;font-size:12.5px;color:var(--muted);max-width:calc(100% - 80px);transition:opacity .3s}
.hint.off{opacity:0;pointer-events:none}

/* painel */
#panel{min-width:0;background:var(--surface);border:1px solid var(--hair);border-radius:16px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.tabs{display:flex;gap:4px;padding:8px 8px 0;border-bottom:1px solid var(--hair);align-items:flex-end}
.tabs button{border:0;background:none;padding:9px 12px;border-radius:10px 10px 0 0;color:var(--muted);font-weight:600;cursor:pointer;border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .pclose{margin-left:auto;display:none;width:34px;height:34px;padding:0;place-items:center;border-radius:10px}
.pane{flex:1;min-height:0;overflow:auto;padding:18px 18px 24px;overscroll-behavior:contain}
.crumb{display:flex;flex-wrap:wrap;gap:2px 6px;font-size:12px;color:var(--muted);margin-bottom:8px}
.crumb button{border:0;background:none;padding:0;color:var(--muted);cursor:pointer;text-decoration:underline;text-decoration-color:var(--hair);text-underline-offset:3px}
.crumb button:hover{color:var(--ink)}
.pane h2{font-size:21px;line-height:1.2;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.pane h2 .num{font-size:15px;margin-right:6px;opacity:.7}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:12px;background:var(--accent-soft);color:var(--ink)}
.chip.must{background:var(--doc-bg);color:var(--doc-ink)}
.chip.reg{background:var(--reg-bg);color:var(--reg-ink)}
.chip.ex{background:var(--ex-bg);color:var(--ex-ink)}
.lead{margin-top:12px;font-size:14.5px;line-height:1.55;max-width:62ch}
.sec{margin-top:20px}
.sec h3{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.sec ol,.sec ul{padding-left:20px;display:grid;gap:6px;max-width:62ch}
.sec li::marker{color:var(--muted)}
.box{border-radius:12px;padding:12px 14px;background:var(--accent-soft);max-width:62ch}
.box.ex{background:var(--ex-bg);color:var(--ex-ink)}
.box.tip{background:var(--doc-bg);color:var(--doc-ink)}
.box b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;opacity:.85}
.rows{display:grid;gap:6px}
.row{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--hair);border-radius:12px;padding:8px 10px;background:var(--surface)}
.row .nm{flex:1;min-width:0;border:0;background:none;text-align:left;padding:0;cursor:pointer;font-weight:600;line-height:1.35}
.row .nm:hover{text-decoration:underline}
.row .nm small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:1px}
.cb{flex:none;width:20px;height:20px;margin-top:1px;accent-color:var(--ok);cursor:pointer}
.links{display:flex;flex-direction:column;gap:6px}
.lk{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--hair);background:var(--surface);border-radius:12px;padding:8px 10px;text-align:left;cursor:pointer}
.lk:hover{background:var(--accent-soft)}
.lk .num{margin-top:2px}
.lk span.t{display:block;font-weight:600}
.lk span.w{display:block;color:var(--muted);font-size:12.5px}
.big{display:flex;align-items:center;gap:10px;margin-top:18px;padding:12px 14px;border-radius:12px;border:1px solid var(--hair);cursor:pointer;font-weight:600}
.big input{width:20px;height:20px;accent-color:var(--ok)}
.pd-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.pd-strip button{border:1px solid var(--hair);background:var(--surface);border-radius:12px;padding:8px;text-align:left;cursor:pointer}
.pd-strip button:hover{background:var(--accent-soft)}
.pd-strip b{display:block;font-size:13px}
.pd-strip span{font-family:var(--font-mono);font-size:11.5px;color:var(--muted)}
.gh{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 8px;font-weight:700}
.gh span{font-family:var(--font-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.gh:first-child{margin-top:0}
.filt{display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:13px}
.filt input{accent-color:var(--accent)}

/* matriz de risco */
.mx{margin-top:2px}
.mx-grid{display:grid;grid-template-columns:96px repeat(5,minmax(0,1fr));gap:3px;font-variant-numeric:tabular-nums}
.mx-rl{font-size:11.5px;color:var(--muted);display:flex;align-items:center;line-height:1.2}
.mx-c{position:relative;height:38px;border-radius:6px;display:grid;place-items:center;font-weight:600;font-size:13px;color:var(--ink)}
.mx-c.low{background:var(--risk-low)} .mx-c.mid{background:var(--risk-mid)} .mx-c.high{background:var(--risk-high)}
.mx-c i{position:absolute;right:3px;top:3px;font-style:normal;font:700 9.5px/1 var(--font-mono);background:var(--ink);color:var(--surface);border-radius:50%;width:15px;height:15px;display:grid;place-items:center}
.mx-cl{text-align:center;font-size:11.5px;color:var(--muted);padding-top:2px}
.mx-leg{display:grid;gap:3px;margin-top:10px;font-size:12.5px}
.mx-leg div{display:flex;gap:8px}
.mx-leg i{flex:none;font-style:normal;font:700 9.5px/1 var(--font-mono);background:var(--ink);color:var(--surface);border-radius:50%;width:15px;height:15px;display:grid;place-items:center;margin-top:2px}
.mx-bands{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:12px;color:var(--muted)}
.mx-bands span{display:inline-flex;gap:5px;align-items:center}

@media (max-width:860px){
  body{padding-block:10px}
  .top{grid-template-columns:minmax(0,1fr) auto}
  .srch{grid-column:1 / -1;order:3}
  .ttl h1{font-size:17px}
  .progress .pl{display:none}
  .work{grid-template-columns:minmax(0,1fr)}
  #panel{position:fixed;z-index:40;left:16px;right:16px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-height:58%;height:58%;box-shadow:var(--shadow);transform:translateY(calc(100% + 40px));visibility:hidden;transition:transform .25s,visibility 0s .25s}
  #panel.open{transform:none;visibility:visible;transition:transform .25s}
  .tabs .pclose{display:grid}
  .hint{max-width:calc(100% - 76px)}
  .pd-strip{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion:reduce){
  .tg svg,.progress .bar i,#panel{transition:none!important}
}
</style>

<div id="app">
  <header class="top">
    <div class="ttl">
      <h1>Mapa Mental do SGS</h1>
      <p>ABNT NBR ISO 21101 · Turismo de Aventura</p>
    </div>
    <div class="srch">
      <label for="q" class="sr-only">Buscar no mapa</label>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.2-4.2"/></svg>
      <input id="q" type="search" placeholder="Buscar: escopo, política, incidentes…" autocomplete="off">
      <div id="sr" class="results" hidden></div>
    </div>
    <button id="prog" class="progress" type="button" aria-label="Itens prontos. Abrir checklist">
      <span class="pl">Itens prontos</span><b id="pn">0/0</b><span class="bar"><i id="pb"></i></span>
    </button>
  </header>

  <div class="legend" id="legend">
    <button class="lg" type="button" data-hl="doc" aria-pressed="false"><span class="tag">DOC</span>Documentos</button>
    <button class="lg" type="button" data-hl="reg" aria-pressed="false"><span class="tag" style="--solid:var(--reg-solid)">REG</span>Registros</button>
    <button class="lg" type="button" data-hl="ex" aria-pressed="false"><span class="tag" style="--solid:var(--ex-solid)">EX</span>Exemplos</button>
    <span class="note">Etiqueta cheia: exigido pela norma · Só contorno: recomendado</span>
  </div>

  <div class="work">
    <section id="stage" aria-label="Mapa mental interativo">
      <div id="world"><svg id="edges" aria-hidden="true"></svg></div>
      <div class="hint" id="hint">Arraste para mover · role ou use + e − para ampliar · seta ao lado do nó abre o ramo</div>
      <div class="ctl" role="group" aria-label="Controles do mapa">
        <button id="bExp" type="button" title="Expandir tudo" aria-label="Expandir tudo"></button>
        <button id="bCol" type="button" title="Recolher tudo" aria-label="Recolher tudo"></button>
        <hr>
        <button id="bIn" type="button" title="Ampliar" aria-label="Ampliar"></button>
        <button id="bOut" type="button" title="Reduzir" aria-label="Reduzir"></button>
        <button id="bFit" type="button" title="Ajustar à tela" aria-label="Ajustar à tela"></button>
      </div>
    </section>
    <aside id="panel" aria-label="Detalhes">
      <div class="tabs" role="tablist">
        <button id="tabD" role="tab" type="button" aria-selected="true">Detalhes</button>
        <button id="tabC" role="tab" type="button" aria-selected="false">Checklist</button>
        <button class="pclose" id="pclose" type="button" aria-label="Fechar painel"></button>
      </div>
      <div class="pane" id="paneD" role="tabpanel"></div>
      <div class="pane" id="paneC" role="tabpanel" hidden></div>
    </aside>
  </div>
</div>

<script>
"use strict";
/* ============================================================
   CONTEÚDO
   ============================================================ */
const L=(to,why)=>({to,why});
const P=(t,d,o)=>Object.assign({k:'pt',t,d},o||{});
const X=(t,d,o)=>Object.assign({k:'ex',t,d},o||{});
const D=ref=>({k:'doc',ref});
const R=ref=>({k:'reg',ref});

    d:'Texto curto em que a direção assume compromissos de segurança. Deve ser documentada, comunicada dentro da empresa e estar disponível às partes interessadas.',
    how:['Responda: quem somos e o que prometemos sobre segurança, meio ambiente, boas práticas e lei?','Escreva em até uma página, com frases diretas e só o que dá para cumprir.','Assine, date e divulgue: briefing, mural, site, material de venda.','Revise uma vez por ano e confira se a prática bate com o texto.'],
    tip:'O Guia ABNT/Sebrae sugere três apoios para a política: segurança, responsabilidade socioambiental e atendimento aos requisitos aplicáveis.',
    links:[L('c6_2','Os objetivos nascem da política.'),L('c7_3','A equipe precisa conhecer a política.'),L('c7_4','Participantes e partes interessadas também recebem a política.')],
    c:[
     P('Apropriada ao propósito da empresa','Reflete o que a empresa realmente faz e consegue manter. Evite promessas que a operação não sustenta.'),
     P('Estrutura para os objetivos','Cada compromisso da política vira objetivo e meta em 6.2.'),
     P('Compromisso com requisitos aplicáveis','Atender leis, normas ABNT, planos de manejo e regras dos locais onde atua.'),
     P('Compromisso com melhoria contínua','Prometer revisar e melhorar o SGS. É exigência explícita da norma.'),
     X('Exemplo de política','A [Nome da Empresa] se compromete a: identificar e controlar os riscos de cada atividade; manter equipe competente e equipamentos em bom estado; cumprir a legislação, as normas e as regras dos locais onde atua; reduzir impactos ambientais e sociais; informar o participante sobre os riscos antes da atividade; melhorar continuamente o seu sistema de gestão da segurança.'),
     D('d_politica')]},
   {id:'c5_3',k:'cl',num:'5.3',t:'Funções, Responsabilidades e Autoridades',
    d:'Cada função que afeta a segurança tem responsabilidades e autoridades definidas e comunicadas. A direção também designa quem garante que o SGS cumpre a norma e quem reporta o desempenho à direção.',
    how:['Desenhe um organograma por função. Uma pessoa pode ter várias funções.','Nomeie o responsável pelo SGS. Ele precisa de disciplina e visão do sistema, não precisa ser o melhor condutor.','Dê ao condutor principal autoridade para interromper a atividade, cancelar e vetar participante que não atenda aos requisitos.','Comunique por reunião, e-mail ou mural e guarde a prova.'],
    ex:'Direção e responsável pelo SGS: [Nome]. Condutor principal: [Nome], pode interromper a atividade e impedir participante sem aptidão. Condutor auxiliar: [Nome], apoia as decisões do principal e cuida da retaguarda do grupo.',
    tip:'Defina por função, não por nome. O nome muda, a função continua.',
    links:[L('c7_2','Cada função tem uma competência mínima.'),L('c8_1','Os procedimentos operacionais dizem quem faz.'),L('c8_3','Define quem investiga e reporta incidentes.')],
    c:[
     P('Responsável pelo SGS','Designado formalmente pela direção. Garante a implantação dos requisitos e leva o desempenho do SGS à direção.'),
     P('Organograma por função','Inclui quem lidera, executa e verifica atividades de segurança, e também quem pode ser acionado em emergência.'),
     P('Autoridade para interromper','Condutor com poder real de parar a atividade e vetar participantes. Essa decisão pode salvar vidas.'),
     D('d_funcoes')]}
  ]},

 /* ---------- 6 PLANEJAMENTO ---------- */
 {id:'g6',k:'grp',num:'6',t:'Planejamento',pd:'Planejar',
  d:'Decidir o que fazer: riscos, leis, objetivos e plano de ação. É o coração do SGS.',
  c:[
   {id:'c6_1_1',k:'cl',num:'6.1.1',t:'Riscos e Oportunidades do SGS',
    d:'Com o contexto e as partes interessadas em mãos, a empresa decide quais riscos e oportunidades precisam de ação para o SGS dar certo, evitar efeitos indesejados e melhorar.',
    how:['Releia as questões do contexto (4.1) e os requisitos das partes interessadas (4.2).','Para cada uma, pergunte: o que pode dar errado? o que pode melhorar?','Planeje as ações, onde entram nos processos e como saber se funcionaram.'],
    ex:'Risco do SGS: só um condutor sabe vistoriar as ancoragens. Ação: treinar um segundo condutor até [data]. Oportunidade: parceria com o grupo de resgate local para simulados.',
    tip:'Não confunda: 6.1.1 trata dos riscos do próprio sistema de gestão; 6.1.2 trata dos riscos das atividades de aventura.',
    links:[L('c4_1','Parte do contexto.'),L('c6_1_2','Riscos das atividades.'),L('c6_2','As ações viram objetivos e plano.')],
    c:[
     P('Garantir os resultados pretendidos','O SGS só funciona se os riscos e as oportunidades do próprio sistema forem tratados.'),
     P('Evitar ou reduzir efeitos indesejáveis','Antecipar falhas, como depender de uma única pessoa ou não ter equipamento reserva.'),
     P('Alcançar a melhoria contínua','Aproveitar oportunidades: treinamentos, parcerias e novas práticas.')]},
   {id:'c6_1_2',k:'cl',num:'6.1.2',t:'Gestão de Riscos da Atividade',
    d:'A empresa estabelece e implementa um processo sistemático de gestão de riscos para as atividades de aventura. O processo é documentado e faz parte do SGS. Está detalhado no Anexo A da norma.',
    how:['Faça o Contexto de cada produto.','Divida a atividade em etapas e liste os perigos de cada uma.','Dê nota de probabilidade e consequência, considerando os controles que você já usa.','Compare com o nível de risco aceitável.','Trate o que passar do aceitável e revise sempre que houver incidente.'],
    tip:'Um inventário por produto. Ele nunca está pronto: revise depois de incidentes e de mudanças.',
    links:[L('c4_3','Cada produto do escopo precisa de contexto e inventário.'),L('c8_1','Cada tratamento vira controle operacional.'),L('c8_2','Os piores cenários do inventário viram emergências do PAE.'),L('c9_2','A auditoria considera os resultados da avaliação de riscos.'),L('n31000','Base metodológica.')],
    c:[
     P('1 · Contexto da atividade','Para cada produto, defina: a atividade e seu escopo (locais, duração, etapas); os objetivos da gestão de risco; limites e interfaces, como ciclistas na mesma trilha ou regras de uma Unidade de Conservação; a metodologia; e os critérios de avaliação, incluindo o nível de risco aceitável com a justificativa. Riscos de transporte, hospedagem, meio ambiente, saúde e cultura também entram.'),
     P('2 · Identificar perigos e riscos','Divida a atividade em etapas. No rapel, por exemplo: caminhada de acesso, preleção, descida e retorno. Em cada etapa, liste o que pode causar dano, em rotina e fora da rotina, com e sem supervisão, considerando a competência do participante, os terceirizados e os equipamentos da empresa e do participante. Envolva os condutores e use a experiência de outras operações. Exemplos de perigos: queda de pedras, ataque de abelhas, cabelo preso no descensor, rompimento de ancoragem.'),
     P('3 · Analisar: probabilidade × consequência','Dê nota de 1 a 5 à probabilidade e à consequência e multiplique. Considere causas, fontes e os controles que você já usa. O mesmo dano pesa diferente conforme o local: uma torção dentro de um cânion, longe de socorro, pode ser mais grave que uma fratura perto da estrada.',{matrix:true}),
     P('4 · Avaliar: o risco é aceitável?','Compare o nível de risco com o critério definido no contexto. Quem define o que é aceitável é a empresa: o arvorismo, com público leigo, aceita menos risco que uma travessia de alta montanha, que exige participante preparado. Risco maior não significa gestão pior, mas exige informar o participante.',{matrix:true}),
     P('5 · Tratar o risco','Quando o risco passa do aceitável, escolha uma ou mais opções: reduzir a probabilidade (briefing, capacitação, procedimentos, manutenção), reduzir a consequência (capacete, colete, perneira), eliminar (não operar na chuva, mudar o roteiro) ou compartilhar (seguro, contrato, parceiros). Defina responsável, prazo e recursos. Depois de implantado, o tratamento vira controle operacional.'),
     X('Exemplo: inventário de rapel','Etapa: descida. Perigo: queda de grande bloco de pedra solta sobre participantes e equipe. Controle existente: identificação de pedra solta. Probabilidade 4 × consequência 5 = nível 20, inaceitável. Tratamento: retirar o bloco, manter a verificação regular e interromper a operação sempre que houver bloco solto.\n\nOutra linha: prender o cabelo no descensor. Probabilidade 3 × consequência 2 = 6. Tratamento: melhorar o briefing explicando o porquê e definir o tamanho máximo do cabelo solto.'),
     D('d_contexto_ativ'),D('d_inventario')]},
   {id:'c6_1_3',k:'cl',num:'6.1.3',t:'Requisitos Legais',
    d:'Identificar as leis e outros requisitos aplicáveis, cumprir e comunicar às pessoas envolvidas.',
    how:['Levante leis, decretos e resoluções federais, estaduais e municipais sobre segurança na sua atividade.','Levante os outros requisitos: normas ABNT, plano de manejo da Unidade de Conservação, regras do proprietário da área e manuais de equipamentos.','Marque o que você já atende e dê prazo para o que falta.','Comunique à equipe e aos participantes o que importa para eles. Não é preciso distribuir o texto da lei.','Revise a lista a cada ano e guarde cópia da legislação.'],
    ex:'Se a lei exige colete salva-vidas, o condutor precisa saber disso e o participante precisa ser avisado no briefing.',
    tip:'O Guia ABNT/Sebrae cita o Decreto 7.381/2010 (art. 34): condutores conforme normas, sistema de gestão da segurança, seguro facultativo e termos de conhecimento, responsabilidade e ciência. Assessoria jurídica ajuda, mas não é obrigatória.',
    links:[L('c4_2','Vem das partes interessadas.'),L('c5_2','A política se compromete com os requisitos.'),L('c7_4','Parte deles precisa ser comunicada.'),L('c9_1','O atendimento é monitorado.')],
    c:[
     P('Identificar leis e normas aplicáveis','Leis, decretos e resoluções (federal, estadual e municipal) e normas ABNT. Em Unidades de Conservação e áreas privadas, as regras do local pesam ainda mais.'),
     P('Manter atualizado','Reveja a lista periodicamente e guarde cópia da legislação, em meio físico ou eletrônico.'),
     P('Comunicar à equipe e aos participantes','Informar o que cada um precisa saber para agir de acordo com a lei e com as regras do local.'),
     D('d_legal')]},
   {id:'c6_2',k:'cl',num:'6.2',t:'Objetivos de Segurança e Plano',
    d:'Objetivos de segurança coerentes com a política, mensuráveis quando possível, monitorados, comunicados e atualizados, junto com o plano para alcançá-los. Devem ser mantidos como informação documentada.',
    how:['Para cada compromisso da política, defina um objetivo e uma meta com prazo.','Coloque os tratamentos de risco do inventário no mesmo plano.','Para cada ação, anote responsável, recurso, prazo e situação.','Acompanhe com frequência e atualize o plano quando a operação mudar.'],
    tip:'Objetivo fácil demais mostra pouco compromisso e difícil demais desmotiva. Escolha algo que agregue valor e dê para medir.',
    links:[L('c5_2','Os objetivos vêm da política.'),L('c6_1_2','Os tratamentos de risco entram no plano.'),L('c9_1','A situação do plano é monitorada.'),L('c7_1','O plano mostra de quais recursos você precisa.')],
    c:[
     P('Objetivos mensuráveis (metas)','Meta é o objetivo com número e prazo. Exemplo: 100% dos condutores com primeiros socorros em dia até [mês/ano].'),
     P('Plano de ação: o quê, quem, quando','A norma pede: o que será feito, quais recursos, quem é o responsável, quando termina e como os resultados serão avaliados.'),
     P('Tratamentos de risco entram no plano','A documentação de tratamento de riscos faz parte do planejamento para alcançar os objetivos.'),
     X('Exemplo de objetivo e plano','Política: reduzir os riscos à vida e à integridade física de todos os envolvidos.\nObjetivo: capacitar os condutores.\nMeta: 100% dos condutores atendendo à competência mínima da norma de condutores até [mês/ano].\nAções: identificar cursos ([Responsável], [prazo], atingido); orçar os cursos ([Responsável], [prazo], atingido); definir a data ([Responsável], [prazo], em andamento); realizar o curso (orçamento de [valor], [prazo], não atingido).'),
     D('d_objetivos')]}
  ]},

 /* ---------- 7 APOIO ---------- */
 {id:'g7',k:'grp',num:'7',t:'Apoio',pd:'Planejar',
  d:'O que sustenta o SGS no dia a dia: recursos, pessoas competentes, comunicação e documentos.',
  c:[
   {id:'c7_1',k:'cl',num:'7.1',t:'Recursos',
    d:'A direção determina e fornece os recursos necessários: dinheiro, pessoas, equipamentos e tecnologia.',
    how:['Separe o que é mínimo para operar com segurança do que é para alcançar novos objetivos.','Use o plano de objetivos e os tratamentos de risco para estimar o que precisa.','Nunca opere com equipamento de segurança sucateado por falta de verba.'],
    tip:'Esperar recursos para metas futuras é aceitável. Não ter recurso para o mínimo de segurança não é.',
    links:[L('c6_2','Os recursos entram no plano.'),L('c5_1','A direção garante recursos.')],
    c:[
     P('Recursos mínimos de segurança','Equipamentos íntegros, equipe competente, comunicação e primeiros socorros. Sem isso, a atividade não deve acontecer.'),
     P('Recursos para novos objetivos','Treinamentos, melhorias de estrutura e tecnologias planejadas em prazos viáveis.')]},
   {id:'c7_2',k:'cl',num:'7.2',t:'Competência',
    d:'Definir a competência necessária de quem trabalha com segurança, garantir que as pessoas a tenham (formação, treinamento ou experiência), agir quando faltar e guardar a prova.',
    how:['Para cada função (condutor principal, auxiliar, apoio), liste o mínimo: conhecimentos, habilidades e atitudes.','Use as normas de competência de condutores e a ISO 21102 como referência.','Compare com o currículo e os certificados de cada pessoa.','Planeje treinamento para o que falta e confira se funcionou.','Guarde certificados, listas de presença e avaliações.'],
    tip:'Primeiro garanta a competência mínima. Depois busque a desejada.',
    links:[L('c5_3','Competência por função.'),L('n21102','Referência para líderes.'),L('c8_2','Equipe de emergência competente.'),L('c9_1','A eficácia dos treinamentos é monitorada.')],
    c:[
     P('Definir a competência mínima por função','Conhecimentos (nós, primeiros socorros), habilidades (decidir, falar com clareza) e atitudes (empatia, firmeza).'),
     P('Formação, treinamento ou experiência','A competência vem de educação formal, treinamento da empresa, qualificação externa e experiência comprovada.'),
     P('Avaliar se o treinamento funcionou','Observar na prática, aplicar prova ou simulado e acompanhar as saídas seguintes.'),
     D('d_matriz_comp'),R('r_competencia')]},
   {id:'c7_3',k:'cl',num:'7.3',t:'Consciência',
    d:'Todas as pessoas que trabalham sob o controle da empresa conhecem a política, entendem como contribuem e sabem o que acontece se o SGS não for cumprido.',
    how:['Faça uma integração curta para quem entra: política, regras de ouro e quem decide o quê.','Retome o tema em reuniões e briefings de equipe.','Peça que expliquem a política com as próprias palavras.','Guarde a lista de presença.'],
    ex:'Integração de 30 minutos para novos condutores: política, três regras de ouro da operação e a consequência de ignorá-las.',
    links:[L('c5_2','A política é o conteúdo principal.'),L('c7_2','Complementa a competência técnica.')],
    c:[
     P('Conhecer a política','Cada pessoa sabe o que a empresa promete e consegue explicar.'),
     P('Saber como contribui','Entende seu papel na eficácia do SGS e os ganhos de um desempenho de segurança melhor.'),
     P('Conhecer as consequências de não cumprir','Entende o que o descumprimento causa: riscos, não conformidades e medidas da empresa.'),
     R('r_treinamento')]},
   {id:'c7_4',k:'cl',num:'7.4',t:'Comunicação',
    d:'A empresa define o que comunicar, quando, a quem e como. Há três frentes: comunicação geral, com a equipe e com os participantes.',
    how:['Monte um quadro com o quê, quando, quem e como.','Defina um processo documentado de consulta com a equipe.','Defina um processo documentado de informação aos participantes, antes, durante e depois.','Use a ISO 21103 como referência do conteúdo mínimo.'],
    tip:'A comunicação deve ser acessível: considere idioma, alfabetização e deficiência de fala, audição ou visão (ISO 21103). Informar o participante sobre os riscos é, em si, um controle operacional.',
    links:[L('n21103','Conteúdo mínimo ao participante.'),L('c8_2','O participante é informado do plano de emergência.'),L('c6_1_2','Comunicar riscos é um controle operacional.'),L('c4_2','Quem são os interlocutores.')],
    c:[
     P('7.4.1 Plano geral: o quê, quando, quem, como','Define as comunicações internas e externas ligadas ao SGS.'),
     P('7.4.2 Com a equipe: engajamento e consulta','A equipe participa da criação e revisão de políticas e procedimentos, é consultada em mudanças que afetam sua segurança, tem representação e sabe quem a representa e quem representa a direção. O processo deve ser documentado.'),
     P('7.4.3 Com participantes: informar e ouvir','A empresa informa os participantes sobre segurança e pede a eles as informações que afetam a gestão da segurança. O processo deve ser documentado.'),
     P('Antes, durante e depois da atividade','Antes: quem somos, atividade, preço, nível de dificuldade, itinerário, seguro, riscos, o que levar e condicionamento físico. Durante: o que acontece em cada etapa, mudanças e resposta a incidentes. Depois: se houve problema, o que foi, suas implicações e o que o participante precisa saber ou fazer.'),
     D('d_com_equipe'),D('d_com_part'),D('d_termo'),R('r_reuniao')]},
   {id:'c7_5',k:'cl',num:'7.5',t:'Informação Documentada',
    d:'A informação documentada que a norma exige e a que a empresa julga necessária, criada, atualizada e controlada.',
    how:['Documente só o necessário. Documento que ninguém usa não ajuda.','Padronize cabeçalho e rodapé: título, código, data, versão, quem criou e quem aprovou.','Todo documento é revisado e aprovado antes de entrar em uso.','Defina onde fica, quem acessa, backup, versão, guarda e descarte.','Registros não são editados e não têm versão.'],
    tip:'Documento tem versão e aprovação. Registro prova que algo foi feito e não se altera. O Guia ABNT/Sebrae alerta que alterar um registro pode ser considerado fraude.',
    links:[L('c4_3','O escopo está entre os documentos.'),L('c9_2','A auditoria confere documentos e registros.')],
    c:[
     P('7.5.1 O que documentar','Escopo, política, gestão de riscos, objetivos, evidências de competência, consultas, procedimentos operacionais, testes de emergência, incidentes, monitoramento, auditorias, análises críticas e não conformidades. A quantidade depende do tamanho da empresa, da complexidade dos processos e da competência das pessoas.'),
     P('7.5.2 Criar e atualizar','Identificação (título, data, autor, código), formato e mídia (papel, digital, foto, vídeo) e revisão e aprovação.'),
     P('7.5.3 Controlar','Distribuição e acesso, armazenamento e legibilidade, controle de versão, retenção e descarte. Documentos externos usados, como normas e leis, também são identificados e controlados.'),
     D('d_lista_mestra')]}
  ]},

 /* ---------- 8 OPERAÇÃO ---------- */
 {id:'g8',k:'grp',num:'8',t:'Operação',pd:'Fazer',
  d:'Colocar em prática o que foi planejado: rotina segura, preparo para emergência e tratamento de incidentes.',
  c:[
   {id:'c8_1',k:'cl',num:'8.1',t:'Planejamento e Controle Operacional',
    d:'Transformar as decisões do planejamento em rotina: critérios, controle, procedimentos documentados, controle de mudanças e de terceirizados.',
    how:['Para cada tratamento do inventário de riscos, crie ou ajuste um controle operacional.','Escreva o passo a passo de cada atividade, com briefing e check-list. Fotos e vídeos valem.','Crie procedimento para manutenção e controle dos equipamentos.','Defina a competência mínima do participante e confira antes de começar.','Controle quem terceiriza parte da operação e o que muda.'],
    tip:'Documente “na medida necessária”: o suficiente para ter confiança de que foi feito como planejado. Nem mais, nem menos.',
    links:[L('c6_1_2','Os controles vêm do inventário de riscos.'),L('c5_3','Os procedimentos dizem quem faz.'),L('c7_2','A equipe precisa ser competente para executá-los.'),L('c8_2','Plano de emergência.')],
    c:[
     P('Terceirizados e fornecedores','Quando outra empresa faz parte da operação, como transporte, hospedagem ou alimentação, o processo continua sendo seu. Defina critérios e confira.'),
     P('Mudanças e plano B','Controle as mudanças planejadas e analise as não planejadas. Tenha planos alternativos para cumprir os objetivos de segurança, como outro roteiro em caso de chuva.'),
     X('Exemplo: tirolesa na plataforma de lançamento','Conectar o autosseguro do participante à linha de vida e verificar a trava do mosquetão. Conferir em voz alta: capacete, fivelas da cadeirinha, autosseguro e roldanas. Anotar o número da roldana no formulário. Orientar sobre a posição de descida e a frenagem. Confirmar por rádio que o condutor da frenagem está pronto. Se houver descontrole emocional, abortar a descida.'),
     D('d_proc_op'),D('d_equip'),D('d_comp_part'),R('r_checklist')]},
   {id:'c8_2',k:'cl',num:'8.2',t:'Preparação e Resposta à Emergência',
    d:'Identificar emergências possíveis e seus impactos, ter planos e procedimentos de resposta, recursos e pessoas competentes, testar o plano e informar os participantes.',
    how:['Liste as emergências do inventário: afogamento, queda, picada, participante perdido, clima.','Mapeie bombeiros, SAMU, hospital e resgate e deixe os contatos à mão.','Escreva o PAE: primeiros socorros, comunicação, remoção, atendimento médico, seguro, família e imprensa.','Colete a Ficha do Participante antes da atividade.','Faça simulado ou exercício de mesa e registre o resultado.','Informe os participantes do que eles precisam saber e fazer.'],
    tip:'A estrutura de resposta é inversamente proporcional ao socorro disponível na região. Em área remota, a equipe precisa de mais capacidade própria.',
    links:[L('c6_1_2','As emergências nascem do inventário de riscos.'),L('c7_4','Os participantes são informados do plano.'),L('c7_2','Equipe competente em primeiros socorros.'),L('c8_3','Cada emergência vira um incidente a registrar.')],
    c:[
     P('Identificar emergências possíveis','Situações sérias que pedem ação imediata e seus impactos, conforme o local e a atividade.'),
     P('Dados mínimos do participante','Identificação, contato de emergência (nome e meio), assistência especial e condições de saúde. Colete, guarde e use os dados conforme a lei aplicável, que no Brasil inclui a LGPD.'),
     P('Testar o plano','Testes periódicos, no local ou em exercício de mesa, em que a equipe simula o plano sobre um mapa. Documente e melhore.'),
     P('Informar os participantes','Antes de começar, o participante conhece o que lhe cabe no plano. Em muitos casos, a melhor ação é aguardar a orientação da equipe.'),
     D('d_pae'),R('r_ficha'),R('r_teste')]},

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const IC={
 plus:'<path d="M12 5v14M5 12h14"/>',minus:'<path d="M5 12h14"/>',
 fit:'<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',
 expand:'<path d="M7 9l5-5 5 5M7 15l5 5 5-5"/>',collapse:'<path d="M7 4l5 5 5-5M7 20l5-5 5 5"/>',
 chev:'<path d="M9 6l6 6-6 6"/>',check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',close:'<path d="M6 6l12 12M18 6L6 18"/>'
};
const ico=(n,s)=>`<svg width="${s||18}" height="${s||18}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;

const GAPX=64,GAPY=12;
const RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const nodes=[],byId={},leafOf={};
let root,colX=[];

function build(def,parent,depth,idx){
  const n={def,parent,depth,c:[],open:false,vis:false,shown:false,x:0,y:0,o:0,fx:0,fy:0,fo:0,tx:0,ty:0,to:0};
  n.k=def.k;
  if(def.ref){const d=DOCS[def.ref];n.ref=def.ref;n.t=d.t;n.id='i_'+def.ref;n.k=d.type;n.norma=d.norma;leafOf[def.ref]=n;}
  else{n.t=def.t;n.id=def.id||(parent.id+'_'+idx);}
  n.num=def.num||'';
  n.pd=def.pd||null;
  nodes.push(n);byId[n.id]=n;
  (def.c||[]).forEach((cd,i)=>n.c.push(build(cd,n,depth+1,i)));
  return n;
}
function groupOf(n){while(n.parent&&n.parent.parent)n=n.parent;return n;}
function crumbs(n){const a=[];for(let p=n.parent;p;p=p.parent)a.unshift(p);return a;}

/* ---- progresso (preferência só deste navegador) ---- */
const KEY='sgs-mapa-itens-v1';
let done={};
try{done=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){done={};}

/* ---- DOM ---- */
const stage=$('#stage'),world=$('#world'),edges=$('#edges');
let linkG;
function nodeEl(n){
  const w=document.createElement('div');
  w.className='nw d'+Math.min(n.depth,3)+(n.k==='doc'||n.k==='reg'||n.k==='ex'?' k-'+n.k:'');
  w.dataset.id=n.id;
  let inner='';
  if(n.k==='doc'||n.k==='reg'||n.k==='ex'){
    const tx={doc:'DOC',reg:'REG',ex:'EX'}[n.k];
    inner+=`<span class="tag${n.k!=='ex'&&!n.norma?' rec':''}">${tx}</span>`;
  }
  if(n.num)inner+=`<span class="num">${esc(n.num)}</span>`;
  inner+=`<span class="lbl">${esc(n.t)}</span><span class="ck" aria-hidden="true">${ico('check',11)}</span>`;
  w.innerHTML=`<button class="node" type="button">${inner}</button>`+(n.c.length?`<button class="tg" type="button" aria-expanded="false" aria-label="Abrir ou fechar ${esc(n.t)}">${ico('chev',13)}</button>`:'');
  w.style.visibility='hidden';
  n.el=w;n.btn=w.querySelector('.node');n.tg=w.querySelector('.tg');
  world.appendChild(w);
  if(n.parent){
    const p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('class','edge e'+Math.min(n.depth,3));
    p.style.display='none';
    edges.appendChild(p);n.edge=p;
  }
}
function measureAll(){
  const maxW=[];
  nodes.forEach(n=>{
    n.nw=n.btn.offsetWidth;n.h=n.btn.offsetHeight;n.ww=n.el.offsetWidth;
    maxW[n.depth]=Math.max(maxW[n.depth]||0,n.ww);
  });
  colX=[];let x=0;
  for(let d=0;d<maxW.length;d++){colX[d]=x;x+=(maxW[d]||0)+GAPX;}
  nodes.forEach(n=>{n.el.style.display='none';n.el.style.visibility='';});
}

/* ---- layout ---- */
function markVisible(){
  const set=new Set();
  (function m(n){set.add(n);if(n.open)n.c.forEach(m);})(root);
  nodes.forEach(n=>n.vis=set.has(n));
}
function slot(n){
  if(n.open&&n.c.length){let s=0;n.c.forEach((c,i)=>{s+=slot(c)+(i?GAPY:0);});n.sh=Math.max(n.h,s);}
  else n.sh=n.h;
  return n.sh;
}
function place(n,top){
  n.tx=colX[n.depth];
  if(n.open&&n.c.length){
    let tot=0;n.c.forEach((c,i)=>{tot+=c.sh+(i?GAPY:0);});
    let y=top+(n.sh-tot)/2;
    n.c.forEach(c=>{place(c,y);y+=c.sh+GAPY;});
    const a=n.c[0],b=n.c[n.c.length-1];
    n.ty=((a.ty+a.h/2)+(b.ty+b.h/2))/2-n.h/2;
  }else n.ty=top+(n.sh-n.h)/2;
}
function visAnc(n){let a=n.parent;while(a&&!a.vis)a=a.parent;return a||root;}

let anim=null,vAnim=null,raf=0;
const view={x:0,y:0,k:1};
let moved=false;
function relayout(){
  markVisible();slot(root);place(root,0);
  const t0=performance.now();
  nodes.forEach(n=>{
    if(n.vis){
      if(!n.shown){
        n.shown=true;n.el.style.display='';
        const a=visAnc(n);n.x=a.x;n.y=a.y;n.o=0;
        if(n.edge)n.edge.style.display='';
      }
      n.fx=n.x;n.fy=n.y;n.fo=n.o;n.to=1;n.dying=false;
      if(n.tg)n.tg.setAttribute('aria-expanded',n.open?'true':'false');
    }else if(n.shown){
      const a=visAnc(n);
      n.fx=n.x;n.fy=n.y;n.fo=n.o;n.tx=a.tx;n.ty=a.ty;n.to=0;n.dying=true;
    }
  });
  anim={t0,dur:RM?0:300};
  kick();
}
function kick(){if(!raf)raf=requestAnimationFrame(frame);}
const ease=p=>1-Math.pow(1-p,3);
function frame(now){
  raf=0;let more=false;
  if(anim){
    const p=anim.dur?Math.min(1,(now-anim.t0)/anim.dur):1,e=ease(p);
    nodes.forEach(n=>{
      if(!n.shown)return;
      n.x=n.fx+(n.tx-n.fx)*e;n.y=n.fy+(n.ty-n.fy)*e;n.o=n.fo+(n.to-n.fo)*e;
    });
    if(p>=1){
      anim=null;
      nodes.forEach(n=>{if(n.shown&&n.dying){n.shown=false;n.dying=false;n.el.style.display='none';if(n.edge)n.edge.style.display='none';}});
    }else more=true;
  }
  if(vAnim){
    const p=vAnim.dur?Math.min(1,(now-vAnim.t0)/vAnim.dur):1,e=ease(p);
    view.x=vAnim.f.x+(vAnim.t.x-vAnim.f.x)*e;view.y=vAnim.f.y+(vAnim.t.y-vAnim.f.y)*e;view.k=vAnim.f.k+(vAnim.t.k-vAnim.f.k)*e;
    if(p>=1)vAnim=null;else more=true;
    applyView();
  }
  draw();
  if(more)kick();
}
function draw(){
  nodes.forEach(n=>{
    if(!n.shown)return;
    n.el.style.transform=`translate(${n.x.toFixed(1)}px,${n.y.toFixed(1)}px)`;
    n.el.style.opacity=n.o.toFixed(2);
    if(n.edge&&n.parent){
      const p=n.parent,sx=p.x+p.ww,sy=p.y+p.h/2,ex=n.x,ey=n.y+n.h/2,dx=Math.max(24,(ex-sx)*.5);
      n.edge.setAttribute('d',`M${sx.toFixed(1)} ${sy.toFixed(1)}C${(sx+dx).toFixed(1)} ${sy.toFixed(1)} ${(ex-dx).toFixed(1)} ${ey.toFixed(1)} ${ex.toFixed(1)} ${ey.toFixed(1)}`);
      n.edge.style.opacity=n.o.toFixed(2);
    }
  });
  drawLinks();
}
function drawLinks(){
  if(!linkG)return;
  let h='';const s=state.sel;
  if(s&&s.shown&&s.def.links){
    s.def.links.forEach(l=>{
      const t=byId[l.to];if(!t||!t.shown||t.dying)return;
      const a=s,b=t;
      let sx,sy,ex,ey,c1x,c1y,c2x,c2y;
      sy=a.y+a.h/2;ey=b.y+b.h/2;
      if(a.x+a.nw<b.x-10){sx=a.x+a.nw;ex=b.x;const d=Math.max(40,(ex-sx)/2);c1x=sx+d;c2x=ex-d;c1y=sy;c2y=ey;}
      else if(b.x+b.nw<a.x-10){sx=a.x;ex=b.x+b.nw;const d=Math.max(40,(sx-ex)/2);c1x=sx-d;c2x=ex+d;c1y=sy;c2y=ey;}
      else{sx=a.x+a.nw;ex=b.x+b.nw;c1x=sx+70;c2x=ex+70;c1y=sy;c2y=ey;}
      h+=`<path class="link" d="M${sx.toFixed(1)} ${sy.toFixed(1)}C${c1x.toFixed(1)} ${c1y.toFixed(1)} ${c2x.toFixed(1)} ${c2y.toFixed(1)} ${ex.toFixed(1)} ${ey.toFixed(1)}"/><circle class="linkdot" cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="4"/>`;
    });
  }
  linkG.innerHTML=h;
}

/* ---- vista: pan, zoom, ajuste ---- */
function applyView(){world.style.transform=`translate(${view.x}px,${view.y}px) scale(${view.k})`;}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function viewTo(t,dur){
  vAnim={t0:performance.now(),dur:RM?0:(dur==null?320:dur),f:{x:view.x,y:view.y,k:view.k},t};kick();
}
function bounds(){
  let x1=0,x2=0,y1=1e9,y2=-1e9;
  nodes.forEach(n=>{if(!n.vis)return;x2=Math.max(x2,n.tx+n.ww);y1=Math.min(y1,n.ty);y2=Math.max(y2,n.ty+n.h);});
  return {x1,x2,y1,y2};
}
function fit(dur){
  const b=bounds(),W=stage.clientWidth,H=stage.clientHeight,pad=28;
  const bw=b.x2-b.x1,bh=b.y2-b.y1;
  const k=clamp(Math.min((W-pad*2)/bw,(H-pad*2)/bh,1),.5,1);
  const fitsAll=Math.min((W-pad*2)/bw,(H-pad*2)/bh);
  const kk=fitsAll<.5?clamp(fitsAll,.2,.5):k;
  viewTo({k:kk,x:(W-bw*kk)/2-b.x1*kk,y:(H-bh*kk)/2-b.y1*kk},dur);
}
function centerOn(n,dur){
  const W=stage.clientWidth,H=stage.clientHeight;
  const k=clamp(Math.max(view.k,.7),.2,1.2);
  const cx=(n.tx+n.ww/2),cy=(n.ty+n.h/2);
  const bx=bounds();
  // mantém a raiz à esquerda quando o ramo cabe; senão centraliza o nó
  let x=W/2-cx*k,y=H/2-cy*k;
  const left=n.depth>=2?(n.parent.tx):n.tx;
  x=Math.min(x,24-left*k+ (W*0.0));
  viewTo({k,x:Math.min(x,W/2-cx*k),y},dur);
}
function zoomAt(cx,cy,f){
  const k0=view.k,k1=clamp(k0*f,.2,1.8);
  view.x=cx-(cx-view.x)*(k1/k0);view.y=cy-(cy-view.y)*(k1/k0);view.k=k1;applyView();moved=true;hideHint();
}
function hideHint(){$('#hint').classList.add('off');}

/* pointer: arrastar e pinçar */
const ptrs=new Map();let drag=null,dragged=false,pinch=null;
stage.addEventListener('pointerdown',e=>{
  if(e.target.closest('.ctl')||e.button>0)return;
  dragged=false;vAnim=null;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1)drag={id:e.pointerId,x:e.clientX,y:e.clientY,vx:view.x,vy:view.y,on:false};
  if(ptrs.size===2){
    const [a,b]=[...ptrs.values()];
    pinch={d:Math.hypot(a.x-b.x,a.y-b.y),mx:(a.x+b.x)/2,my:(a.y+b.y)/2};drag=null;dragged=true;
  }
});
stage.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const r=stage.getBoundingClientRect();
  if(pinch&&ptrs.size>=2){
    const [a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    view.x+=mx-pinch.mx;view.y+=my-pinch.my;
    zoomAt(mx-r.left,my-r.top,d/pinch.d);
    pinch.d=d;pinch.mx=mx;pinch.my=my;return;
  }
  if(drag&&drag.id===e.pointerId){
    const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
    if(!drag.on&&Math.hypot(dx,dy)>5){drag.on=true;dragged=true;try{stage.setPointerCapture(e.pointerId);}catch(_){}stage.classList.add('grabbing');moved=true;hideHint();}
    if(drag.on){view.x=drag.vx+dx;view.y=drag.vy+dy;applyView();}
  }
});
function endPtr(e){
  ptrs.delete(e.pointerId);
  if(ptrs.size<2)pinch=null;
  if(drag&&drag.id===e.pointerId){drag=null;stage.classList.remove('grabbing');}
}
stage.addEventListener('pointerup',endPtr);
stage.addEventListener('pointercancel',endPtr);
stage.addEventListener('click',e=>{if(dragged){e.stopPropagation();e.preventDefault();dragged=false;}},true);
stage.addEventListener('wheel',e=>{
  e.preventDefault();vAnim=null;
  const r=stage.getBoundingClientRect();
  zoomAt(e.clientX-r.left,e.clientY-r.top,Math.exp(-e.deltaY*(e.ctrlKey?.01:.0016)));
},{passive:false});

/* ---- abrir / fechar / selecionar ---- */
const state={sel:null,hl:null,initial:[]};
function toggle(n,force){
  if(!n.c.length)return;
  n.open=force==null?!n.open:force;
  if(!n.open)n.c.forEach(closeAll);
  relayout();
  if(n.open)requestAnimationFrame(()=>ensureVisible(n));
}
function closeAll(n){n.open=false;n.c.forEach(closeAll);}
function ensureVisible(n){
  // se o ramo aberto sai da tela, desloca a vista para trazê-lo
  const W=stage.clientWidth,H=stage.clientHeight,k=view.k,m=24;
  let x1=n.tx,x2=n.tx+n.ww,y1=n.ty,y2=n.ty+n.h;
  const walk=c=>{if(!c.vis)return;x2=Math.max(x2,c.tx+c.ww);y1=Math.min(y1,c.ty);y2=Math.max(y2,c.ty+c.h);if(c.open)c.c.forEach(walk);};
  n.c.forEach(walk);
  let nx=view.x,ny=view.y;
  if(x2*k+nx>W-m)nx=W-m-x2*k;
  if(x1*k+nx<m)nx=m-x1*k;
  if(y2*k+ny>H-m)ny=H-m-y2*k;
  if(y1*k+ny<m)ny=m-y1*k;
  if(nx!==view.x||ny!==view.y)viewTo({x:nx,y:ny,k},260);
}
function select(n,open){
  state.sel=n;
  nodes.forEach(m=>m.btn.classList.toggle('sel',m===n));
  renderPanel(n);setTab('d');
  if(window.matchMedia('(max-width:860px)').matches)$('#panel').classList.add('open');
  draw();
}
function focusNode(id){
  const n=byId[id];if(!n)return;
  for(let a=n.parent;a;a=a.parent)a.open=true;
  relayout();select(n);
  requestAnimationFrame(()=>centerOn(n));
  moved=true;hideHint();
}
function expandAll(){nodes.forEach(n=>{if(n.c.length)n.open=true;});relayout();requestAnimationFrame(()=>fit());moved=true;}
function collapseAll(){
  nodes.forEach(n=>n.open=false);
  state.initial.forEach(n=>n.open=true);
  relayout();requestAnimationFrame(()=>fit());
}

world.addEventListener('click',e=>{
  const w=e.target.closest('.nw');if(!w)return;
  const n=byId[w.dataset.id];
  if(e.target.closest('.tg')){toggle(n);return;}
  if(e.target.closest('.node')){
    select(n);
    if(n.c.length&&!n.open)toggle(n,true);
  }
});
world.addEventListener('keydown',e=>{
  const w=e.target.closest('.nw');if(!w)return;
  const n=byId[w.dataset.id];
  if(e.key==='ArrowRight'&&n.c.length){e.preventDefault();if(!n.open)toggle(n,true);else n.c[0].btn.focus();}
  if(e.key==='ArrowLeft'){e.preventDefault();if(n.open)toggle(n,false);else if(n.parent)n.parent.btn.focus();}
});

/* ---- destaque por tipo ---- */
function applyHL(){
  const hl=state.hl;
  const keep=new Set();
  if(hl){nodes.forEach(n=>{if(n.k===hl){keep.add(n);for(let a=n.parent;a;a=a.parent)keep.add(a);}});}
  nodes.forEach(n=>n.el.classList.toggle('dim',!!hl&&!keep.has(n)));
  document.querySelectorAll('.lg').forEach(b=>b.setAttribute('aria-pressed',b.dataset.hl===hl?'true':'false'));
}
$('#legend').addEventListener('click',e=>{
  const b=e.target.closest('.lg');if(!b)return;
  state.hl=state.hl===b.dataset.hl?null:b.dataset.hl;
  if(state.hl){nodes.forEach(n=>{if(n.c.length)n.open=true;});relayout();requestAnimationFrame(()=>fit());}
  applyHL();
});

/* ============================================================
   PAINEL
   ============================================================ */
function setTab(t){
  const d=t==='d';
  $('#tabD').setAttribute('aria-selected',d);$('#tabC').setAttribute('aria-selected',!d);
  $('#paneD').hidden=!d;$('#paneC').hidden=d;
}
$('#tabD').onclick=()=>setTab('d');
$('#tabC').onclick=()=>{renderChecklist();setTab('c');};
$('#prog').onclick=()=>{renderChecklist();setTab('c');$('#panel').classList.add('open');};
$('#pclose').innerHTML=ico('close',16);
$('#pclose').onclick=()=>$('#panel').classList.remove('open');
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#panel').classList.remove('open');closeResults();}});

function ol(a){return a&&a.length?`<div class="sec"><h3>Na prática</h3><ol>${a.map(x=>`<li>${x}</li>`).join('')}</ol></div>`:'';}
function boxes(d){
  let h='';
  if(d.ex)h+=`<div class="sec"><div class="box ex"><b>Exemplo</b>${esc(d.ex).replace(/\n/g,'<br>')}</div></div>`;
  if(d.tip)h+=`<div class="sec"><div class="box tip"><b>Dica</b>${esc(d.tip)}</div></div>`;
  return h;
}
function refRow(ref){
  const d=DOCS[ref];
  return `<div class="row"><input class="cb" type="checkbox" data-ref="${ref}" aria-label="Já tenho: ${esc(d.t)}" ${done[ref]?'checked':''}>
  <button class="nm" type="button" data-go="i_${ref}">${esc(d.t)}<small>${d.type==='doc'?'Documento':'Registro'} · ${d.norma?'exigido pela norma':'recomendado'}</small></button></div>`;
}
function linksHTML(n){
  const ls=(n.def&&n.def.links)||[];
  if(!ls.length)return '';
  return `<div class="sec"><h3>Conecta com</h3><div class="links">${ls.map(l=>{
    const t=byId[l.to];if(!t)return '';
    return `<button class="lk" type="button" data-go="${t.id}">${t.num?`<span class="num">${esc(t.num)}</span>`:''}<span><span class="t">${esc(t.t)}</span><span class="w">${esc(l.why)}</span></span></button>`;
  }).join('')}</div></div>`;
}
function matrixHTML(){
  const pl={5:'Quase certo',4:'Provável',3:'Pouco provável',2:'Improvável',1:'Quase impossível'};
  const pts={'3,4':'A','3,3':'B','1,5':'C','2,5':'D','4,5':'E','3,2':'F'};
  let h='<div class="sec"><h3>Matriz de risco 5 × 5 (exemplo)</h3><div class="mx"><div class="mx-grid" role="img" aria-label="Matriz de probabilidade por consequência, com seis riscos de exemplo do rapel">';
  for(let p=5;p>=1;p--){
    h+=`<div class="mx-rl">${p} · ${pl[p]}</div>`;
    for(let c=1;c<=5;c++){
      const v=p*c,b=v<=4?'low':v<=12?'mid':'high',m=pts[p+','+c];
      h+=`<div class="mx-c ${b}">${v}${m?`<i>${m}</i>`:''}</div>`;
    }
  }
  h+='<div></div>';
  for(let c=1;c<=5;c++)h+=`<div class="mx-cl">${c}</div>`;
  h+='</div>';
  h+=`<div class="mx-bands"><span><span class="dot" style="background:var(--risk-low)"></span>Aceitável 1 a 4</span><span><span class="dot" style="background:var(--risk-mid)"></span>Tolerável 5 a 12</span><span><span class="dot" style="background:var(--risk-high)"></span>Inaceitável 15 a 25</span></div>`;
  h+=`<p style="margin-top:8px;color:var(--muted);font-size:12.5px">Linhas: probabilidade. Colunas: consequência (1 insignificante, 2 baixa, 3 moderada, 4 alta, 5 catastrófica). As faixas são ilustrativas: a empresa define o que é aceitável no Contexto da Atividade.</p>`;
  h+=`<div class="mx-leg"><div><i>A</i>Ataque de abelhas: 3 × 4 = 12</div><div><i>B</i>Queda de objetos sobre o participante: 3 × 3 = 9</div><div><i>C</i>Rompimento da ancoragem: 1 × 5 = 5</div><div><i>D</i>Rompimento da corda por atrito: 2 × 5 = 10</div><div><i>E</i>Queda de bloco de pedra solta: 4 × 5 = 20</div><div><i>F</i>Cabelo preso no descensor: 3 × 2 = 6</div></div>`;
  h+=`<p style="margin-top:8px;color:var(--muted);font-size:12.5px">Riscos de exemplo do Guia ABNT/Sebrae (rapel). Dica: mesmo com probabilidade baixa, trate como prioridade qualquer risco de consequência catastrófica.</p></div></div>`;
  return h;
}
function crumbHTML(n){
  const cs=crumbs(n).filter(a=>a!==root);
  if(!cs.length)return '';
  return `<div class="crumb">${cs.map(a=>`<button type="button" data-go="${a.id}">${a.num?esc(a.num)+' ':''}${esc(a.t)}</button>`).join('<span aria-hidden="true">›</span>')}</div>`;
}
function renderPanel(n){
  const el=$('#paneD');
  let h='';
  if(n===root){h=INTRO;}
  else if(n.ref){
    const d=DOCS[n.ref],c=byId[d.cl];
    h=crumbHTML(n)+`<h2>${esc(d.t)}</h2>
    <div class="chips"><span class="chip ${d.type==='doc'?'must':'reg'}">${d.type==='doc'?'Documento':'Registro'}</span><span class="chip ${d.norma?'must':''}">${d.norma?'Exigido pela norma':'Recomendado'}</span>${c?`<span class="chip">Requisito ${esc(c.num)}</span>`:''}</div>
    <p class="lead">${esc(d.p)}</p>
    <div class="sec"><h3>O que não pode faltar</h3><ul>${d.inc.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
    <div class="sec"><div class="box"><b>${d.type==='doc'?'Como é um documento':'Como é um registro'}</b>${d.type==='doc'?'Tem cabeçalho com título, código, data e versão, e rodapé com quem criou e quem aprovou. Quando muda, ganha nova versão.':'Prova que algo foi feito. Não tem versão e não se altera depois de preenchido. Precisa ser fácil de achar.'} Liste na Lista Mestra de Documentos e Registros.</div></div>
    <label class="big"><input type="checkbox" data-ref="${n.ref}" ${done[n.ref]?'checked':''}>Já tenho este item</label>
    ${c?`<div class="sec"><h3>Faz parte de</h3><div class="links"><button class="lk" type="button" data-go="${c.id}"><span class="num">${esc(c.num)}</span><span><span class="t">${esc(c.t)}</span><span class="w">Abrir o requisito</span></span></button></div></div>`:''}`;
  }else{
    const def=n.def;
    const pdc=groupOf(n).pd;
    const refs=n.c.filter(c=>c.ref).map(c=>c.ref);
    h=crumbHTML(n)+`<h2>${n.num?`<span class="num">${esc(n.num)}</span>`:''}${esc(n.t)}</h2>`;
    h+=`<div class="chips">${pdc?`<span class="chip">${pdc}</span>`:''}${n.k==='ex'?'<span class="chip ex">Exemplo</span>':''}</div>`;
    h+=`<p class="lead">${esc(def.d||'')}</p>`;
    if(n.k==='ex')h=h.replace('<p class="lead">','<div class="sec"><div class="box ex">').replace(/<\/p>$/,'</div></div>');
    h+=ol(def.how);
    h+=boxes(def);
    if(def.matrix)h+=matrixHTML();
    if(refs.length)h+=`<div class="sec"><h3>Documentos e registros desta etapa</h3><div class="rows">${refs.map(refRow).join('')}</div></div>`;
    h+=linksHTML(n);
  }
  el.innerHTML=h;
  el.scrollTop=0;
  if(n.k==='ex'){
    const b=el.querySelector('.box.ex');
    if(b)b.innerHTML=esc(n.def.d).replace(/\n/g,'<br>').replace(/^/,'<b>Exemplo</b>');
  }
}
$('#panel').addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');
  if(g){focusNode(g.dataset.go);}
});
$('#panel').addEventListener('change',e=>{
  const c=e.target.closest('.cb,.big input');if(!c)return;
  setDone(c.dataset.ref,c.checked);
});
function setDone(ref,v){
  if(v)done[ref]=1;else delete done[ref];
  saveDone();syncDone();
}
function syncDone(){
  let n=0;
  REFS.forEach(r=>{
    const on=!!done[r];if(on)n++;
    const l=leafOf[r];if(l)l.el.classList.toggle('done',on);
  });
  $('#pn').textContent=n+'/'+REFS.length;
  $('#pb').style.width=(REFS.length?n/REFS.length*100:0)+'%';
  document.querySelectorAll('#panel input[data-ref]').forEach(i=>{i.checked=!!done[i.dataset.ref];});
  if(!$('#paneC').hidden)renderChecklist();
}
let onlyNorma=false;
function renderChecklist(){
  const groups=root.c.filter(g=>g.c.some(c=>c.c.some(l=>l.ref)));
  let h=`<label class="filt"><input type="checkbox" id="fNorma" ${onlyNorma?'checked':''}>Mostrar só os exigidos pela norma</label>`;
  groups.forEach(g=>{
    const items=[];g.c.forEach(c=>c.c.forEach(l=>{if(l.ref&&(!onlyNorma||DOCS[l.ref].norma))items.push(l.ref);}));
    if(!items.length)return;
    const dn=items.filter(r=>done[r]).length;
    h+=`<div class="gh"><span style="font-family:var(--font-ui);font-size:14px;color:var(--ink)">${esc(g.num)} · ${esc(g.t)}</span><span>${dn}/${items.length}</span></div><div class="rows">${items.map(refRow).join('')}</div>`;
  });
  const pane=$('#paneC');pane.innerHTML=h;
  const f=$('#fNorma');f.onchange=()=>{onlyNorma=f.checked;renderChecklist();};
}

/* ---- busca ---- */
const idx=[];
function buildIndex(){nodes.forEach(n=>{if(n===root)return;const d=n.ref?DOCS[n.ref].p+' '+DOCS[n.ref].inc.join(' '):(n.def.d||'')+' '+((n.def.how||[]).join(' '));idx.push({n,k:norm(n.t+' '+n.num+' '+d)});});}
const q=$('#q'),sr=$('#sr');
function closeResults(){sr.hidden=true;}
q.addEventListener('input',()=>{
  const v=norm(q.value.trim());
  if(v.length<2){closeResults();return;}
  const ws=v.split(/\s+/);
  const hits=idx.filter(i=>ws.every(w=>i.k.includes(w)));
  hits.sort((a,b)=>(norm(b.n.t).includes(v)?1:0)-(norm(a.n.t).includes(v)?1:0));
  sr.innerHTML=hits.length?hits.slice(0,8).map(h=>`<button type="button" data-go="${h.n.id}"><b>${h.n.num?esc(h.n.num)+' · ':''}${esc(h.n.t)}</b><small>${esc(crumbs(h.n).filter(a=>a!==root).map(a=>a.t).join(' › '))}</small></button>`).join(''):'<div class="none">Nada encontrado. Tente outra palavra.</div>';
  sr.hidden=false;
});
q.addEventListener('keydown',e=>{if(e.key==='Enter'){const b=sr.querySelector('button');if(b)b.click();}});
sr.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b){focusNode(b.dataset.go);closeResults();q.blur();}});
document.addEventListener('click',e=>{if(!e.target.closest('.srch'))closeResults();});

/* ---- controles ---- */
$('#bIn').innerHTML=ico('plus');$('#bOut').innerHTML=ico('minus');$('#bFit').innerHTML=ico('fit');
$('#bExp').innerHTML=ico('expand');$('#bCol').innerHTML=ico('collapse');
const mid=()=>[stage.clientWidth/2,stage.clientHeight/2];
$('#bIn').onclick=()=>{const[m,n]=mid();zoomAt(m,n,1.25);};
$('#bOut').onclick=()=>{const[m,n]=mid();zoomAt(m,n,.8);};
$('#bFit').onclick=()=>{moved=false;fit();};
$('#bExp').onclick=expandAll;
$('#bCol').onclick=()=>{state.hl=null;applyHL();collapseAll();};

/* ---- início ---- */
function init(){
  root=build(TREE,null,0,0);
  nodes.forEach(n=>{if(n.ref)REFS.push(n.ref);});
  linkG=document.createElementNS('http://www.w3.org/2000/svg','g');
  edges.appendChild(linkG);
  nodes.forEach(nodeEl);
  measureAll();
  buildIndex();
  root.open=true;state.initial=[root];
  if(window.innerWidth>860){byId.g4.open=true;state.initial.push(byId.g4);}
  relayout();
  // posição inicial sem animação
  nodes.forEach(n=>{if(n.shown){n.x=n.tx;n.y=n.ty;n.o=1;}});
  anim=null;draw();
  fit(0);
  select(root);
  syncDone();
  if(window.ResizeObserver)new ResizeObserver(()=>{if(!moved)fit(0);}).observe(stage);
  $('#panel').classList.remove('open');
}
const ready=document.fonts&&document.fonts.ready?Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1400))]):Promise.resolve();
ready.then(init);
